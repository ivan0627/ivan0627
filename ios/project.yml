name: Lockout
options:
  bundleIdPrefix: com.lockout
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID
    CODE_SIGN_STYLE: Automatic

targets:
  Lockout:
    type: application
    platform: iOS
    sources: [Lockout]
    entitlements:
      path: Lockout/Lockout.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.lockout.app]
    info:
      path: Lockout/Info.plist
      properties:
        CFBundleDisplayName: Lockout
        UILaunchScreen: {}
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Lockout uses your location only to detect when you arrive at and leave
          your gym, so your training time can unlock your apps. Location is
          processed on this device.
        NSLocationWhenInUseUsageDescription: >-
          Lockout needs your location to register your gym and verify gym visits.
        NSHealthShareUsageDescription: >-
          Lockout reads workouts, active energy and heart rate to verify your
          training and unlock your apps.
        UIBackgroundModes: [location]
    dependencies:
      - target: ShieldConfigExtension
      - target: ShieldActionExtension
      - target: MonitorExtension

  ShieldConfigExtension:
    type: app-extension
    platform: iOS
    sources: [ShieldConfigExtension]
    entitlements:
      path: ShieldConfigExtension/ShieldConfigExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.lockout.app]
    info:
      path: ShieldConfigExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationProvider

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources: [ShieldActionExtension]
    entitlements:
      path: ShieldActionExtension/ShieldActionExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.lockout.app]
    info:
      path: ShieldActionExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionProvider

  MonitorExtension:
    type: app-extension
    platform: iOS
    sources: [MonitorExtension]
    entitlements:
      path: MonitorExtension/MonitorExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.lockout.app]
    info:
      path: MonitorExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockoutActivityMonitor
